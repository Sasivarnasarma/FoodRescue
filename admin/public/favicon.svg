<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="mintBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8FDF0" />
      <stop offset="100%" stop-color="#B8F3CD" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="60%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Squircle rounded background -->
  <rect width="48" height="48" rx="12" fill="url(#mintBg)" />
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" fill="none" stroke="#BBF7D0" stroke-width="1" />

  <!-- Stylized leaf sprout forming subtle heart -->
  <g transform="translate(1, 0)">
    <!-- Left Leaf -->
    <path d="M 23 35 C 23.5 30.5 22 23 17 17.5 C 14 14.5 12 15.5 12 15.5 C 12 15.5 13 21 17 26 C 19.5 29.5 22 33 23 35 Z" fill="url(#leafGrad)" />
    <!-- Right Leaf / Heart Loop -->
    <path d="M 23 35 C 24 28 28.5 22.5 32 17.5 C 33.8 15 33.2 13 30.8 13 C 27.5 13 24.8 16 23.8 19.5 C 23.5 20.8 24.8 21.2 25.5 20.2 C 26.8 18.5 28.8 16 30.8 15.8 C 31.5 15.7 31.8 16.3 31.2 17.5 C 28.2 22.5 24.5 27.5 23 35 Z" fill="url(#heartGrad)" />
    <!-- Stem Base -->
    <path d="M 22.8 33 C 23.2 35.5 23 38 22.6 39.5 C 22.5 39.8 23 40 23.3 39.8 C 24 38 24.1 35 23.7 33 Z" fill="#047857" />
  </g>
</svg>
